openapi: 3.0.3
info:
  title: Gestor de Gastos — BFF
  version: 0.4.0
  description: |
    API do BFF do Gestor de Gastos. É a única API pública: o front chama só
    ela, e ela delega aos serviços por Lambda Invoke (ADR 0004).

    Convenções:

    - **Autenticação:** todo endpoint exige o access token do Cognito em
      `Authorization: Bearer <token>`. Rotas `/admin/*` exigem o grupo
      `admin`.
    - **Valores:** sempre em centavos de real, inteiros (`valorCentavos`,
      `totalCentavos`). Nunca float.
    - **Percentuais:** inteiros em décimos de ponto percentual
      (`percentualDecimos`: 750 = 75,0%), calculados pelo método do maior
      resto para somarem exatamente 1000 em cada visão.
    - **Datas:** `AAAA-MM-DD` sem fuso; mês `AAAA-MM`. Instantes em ISO 8601
      UTC.
    - **Paginação:** cursor opaco em `nextCursor`; ausente na última página.
      Cursor adulterado ou de outra listagem devolve 400 `cursor_invalido`.
    - **Erros:** `application/problem+json` (RFC 9457) com `code` estável e,
      nos 422, `errors[]` por campo.
    - **Isolamento:** o usuário é sempre o do token. Recurso de outro usuário
      responde 404, como se não existisse.
    - **Conta ativa (colaboradores):** as rotas de gastos, cartões,
      categorias e telas aceitam o cabeçalho `X-Conta` com o `donoId` da
      conta em que o usuário colabora. Sem ele, ou com o próprio ID, vale a
      própria conta. Conta sem acesso responde 404 `conta_nao_encontrada`;
      escrita de um colaborador `LEITOR` responde 403 `somente_leitura`. As
      rotas `/colaboradores` são só do dono: com `X-Conta` alheio, 403
      `somente_dono`.
  contact:
    name: Gestor de Gastos
    url: https://github.com/Rossete-Inc/gestor-gastos-bff
  license:
    name: Proprietária
    url: https://github.com/Rossete-Inc/gestor-gastos-bff

servers:
  - url: http://localhost:8080
    description: cmd/local do BFF (ambiente local)

security:
  - cognito: []

tags:
  - name: perfil
    description: Perfil do usuário autenticado
  - name: telas
    description: Dados prontos para cada tela do app
  - name: gastos
    description: Lançamento, edição e exclusão de gastos
  - name: categorias
    description: Categorias padrão e personalizadas
  - name: cartoes
    description: Cartões de crédito, faturas e limite
  - name: admin
    description: Gestão de usuários (somente admin)
  - name: colaboracao
    description: Contas compartilhadas, convites e colaboradores

paths:
  /me:
    get:
      tags: [perfil]
      operationId: obterMe
      summary: Perfil do usuário autenticado
      description: |
        Devolve o perfil do usuário do token. Se o perfil ainda não existir
        (evento `UserConfirmed` atrasado ou ambiente local), cria na hora com
        os dados do Cognito; a criação é idempotente.
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Perfil" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /telas/dashboard:
    parameters:
      - $ref: "#/components/parameters/XConta"
    get:
      tags: [telas]
      operationId: obterTelaDashboard
      summary: Painel do mês
      description: |
        Totais do mês de referência, por grupo e por cartão; fatias da pizza
        nas cinco visões (todas as categorias, só `CARTAO`, só `FIXO`, por
        grupo e por cartão), cada uma com o detalhe da fatia; e os 5 gastos
        mais recentes. Gasto de cartão conta no mês da fatura. Mês sem gastos
        devolve totais zerados e listas vazias.
      parameters:
        - $ref: "#/components/parameters/Mes"
      responses:
        "200":
          description: Painel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelaDashboard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /telas/gastos:
    parameters:
      - $ref: "#/components/parameters/XConta"
    get:
      tags: [telas]
      operationId: obterTelaGastos
      summary: Lista de gastos do mês
      description: |
        Gastos do mês de referência, do mais recente para o mais antigo, com
        filtros opcionais por grupo, categoria e cartão e paginação por
        cursor. Traz também as categorias visíveis e os cartões (ativos e
        arquivados), para montar os filtros.
      parameters:
        - $ref: "#/components/parameters/Mes"
        - name: grupo
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Grupo" }
        - name: categoriaId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: cartaoId
          in: query
          required: false
          description: ID do cartão, ou `SEM_CARTAO` para os gastos sem cartão.
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: autorId
          in: query
          required: false
          description: Só os gastos lançados por esta pessoa; o dono inclui os gastos anteriores aos colaboradores.
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de gastos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelaGastos" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /telas/gasto-form:
    parameters:
      - $ref: "#/components/parameters/XConta"
    get:
      tags: [telas]
      operationId: obterTelaGastoForm
      summary: Dados do formulário de gasto
      description: |
        Categorias visíveis agrupadas por grupo e cartões ativos. Com `id`,
        devolve também o gasto para a tela de edição (e, se o cartão dele
        estiver arquivado, inclui esse cartão na lista); gasto inexistente ou
        de outro usuário responde 404.
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Dados do formulário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelaGastoForm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /gastos:
    parameters:
      - $ref: "#/components/parameters/XConta"
    post:
      tags: [gastos]
      operationId: criarGasto
      summary: Lançar gasto
      description: |
        O grupo do gasto é o grupo da categoria escolhida. Categoria do grupo
        `CARTAO` exige `cartaoId`; `FIXO` aceita cartão opcional. Com cartão,
        o gasto entra no mês da fatura (`mesReferencia`).

        Com `parcelamento`, cria todas as parcelas e devolve a primeira; com
        `recorrencia`, cria a ocorrência do mês da data, e as dos meses
        seguintes aparecem ao abrir cada mês. Reenviar o mesmo lançamento com
        a mesma `chaveIdempotencia` devolve o gasto do primeiro envio sem
        criar nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GastoIn" }
      responses:
        "201":
          description: Gasto criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gasto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }

  /gastos/{id}:
    parameters:
      - $ref: "#/components/parameters/XConta"
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [gastos]
      operationId: atualizarGasto
      summary: Editar gasto
      description: |
        Mesmas validações do lançamento. Trocar a categoria pode trocar o
        grupo; trocar a data ou o cartão recalcula o mês de referência e pode
        mudar o `id` do gasto. Manter o cartão atual vale mesmo arquivado.

        Num gasto de série, `escopo` é obrigatório (422 no campo `escopo`).
        Com `PROXIMAS` ou `TODAS`, só o dia da data vale para a série; mudar
        o mês é 422 no campo `data`. `parcelamento`, `recorrencia` e
        `chaveIdempotencia` são ignorados na edição.
      parameters:
        - $ref: "#/components/parameters/Escopo"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GastoIn" }
      responses:
        "200":
          description: Gasto atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gasto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [gastos]
      operationId: excluirGasto
      summary: Excluir gasto
      description: |
        Num gasto de série, `escopo` é obrigatório: `PROXIMAS` apaga este e os
        seguintes (encerra a recorrência) e `TODAS` apaga a série inteira.
      parameters:
        - $ref: "#/components/parameters/Escopo"
      responses:
        "204": { description: Gasto excluído }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }

  /categorias:
    parameters:
      - $ref: "#/components/parameters/XConta"
    get:
      tags: [categorias]
      operationId: listarCategorias
      summary: Categorias visíveis ao usuário
      description: Padrão do sistema e personalizadas do próprio usuário, agrupadas por grupo.
      responses:
        "200":
          description: Categorias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriasPorGrupo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [categorias]
      operationId: criarCategoria
      summary: Criar categoria personalizada
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoriaIn" }
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Categoria" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Já existe categoria visível com o mesmo nome no grupo, ignorando
            maiúsculas e minúsculas (`code`: `categoria_duplicada`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }

  /categorias/{id}:
    parameters:
      - $ref: "#/components/parameters/XConta"
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [categorias]
      operationId: excluirCategoria
      summary: Excluir categoria personalizada
      responses:
        "204": { description: Categoria excluída }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Categoria padrão não pode ser excluída (`code`: `categoria_padrao`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Há gastos vinculados à categoria (`code`: `categoria_em_uso`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /telas/cartoes:
    parameters:
      - $ref: "#/components/parameters/XConta"
    get:
      tags: [telas]
      operationId: obterTelaCartoes
      summary: Cartões com a fatura do mês e o limite
      description: |
        Todos os cartões (ativos e arquivados) com o total da fatura do mês
        pedido, o vencimento dela e o limite usado e disponível hoje. O limite
        usado soma as faturas que ainda não venceram, inclusive as futuras.
      parameters:
        - $ref: "#/components/parameters/Mes"
      responses:
        "200":
          description: Cartões
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelaCartoes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /cartoes:
    parameters:
      - $ref: "#/components/parameters/XConta"
    get:
      tags: [cartoes]
      operationId: listarCartoes
      summary: Cartões do usuário
      description: Ativos e arquivados, em ordem de apelido.
      responses:
        "200":
          description: Cartões
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaCartoes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [cartoes]
      operationId: criarCartao
      summary: Cadastrar cartão
      description: Apelido único entre os cartões ativos; no máximo 20 ativos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartaoIn" }
      responses:
        "201":
          description: Cartão criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cartao" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Já há 20 cartões ativos (`code`: `limite_cartoes`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }

  /cartoes/{id}:
    parameters:
      - $ref: "#/components/parameters/XConta"
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [cartoes]
      operationId: atualizarCartao
      summary: Editar cartão
      description: Mudar os dias não recalcula os gastos já lançados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartaoIn" }
      responses:
        "200":
          description: Cartão atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cartao" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [cartoes]
      operationId: arquivarCartao
      summary: Arquivar ou reativar cartão
      description: Arquivado some do formulário de gasto; os gastos continuam nos totais.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartaoPatch" }
      responses:
        "200":
          description: Cartão atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cartao" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Reativar com 20 cartões ativos (`code`: `limite_cartoes`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [cartoes]
      operationId: excluirCartao
      summary: Excluir cartão sem gastos
      responses:
        "204": { description: Cartão excluído }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Há gastos no cartão; arquive-o (`code`: `cartao_em_uso`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/telas/usuarios:
    get:
      tags: [admin]
      operationId: obterTelaAdminUsuarios
      summary: Lista de usuários (admin)
      description: Usuários do mais novo para o mais antigo, paginados.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de usuários
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelaAdminUsuarios" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [admin]
      operationId: atualizarUsuario
      summary: Bloquear, reativar ou alterar papel (admin)
      description: |
        Bloquear invalida as sessões do usuário e impede novos logins. O admin
        não pode bloquear a si mesmo nem remover o papel `admin` do último
        administrador ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioPatch" }
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Operação recusada pelas regras da conta. `code`:
            `transicao_invalida`, `bloquear_a_si_mesmo` ou `ultimo_admin`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [admin]
      operationId: excluirUsuario
      summary: Excluir usuário (admin)
      description: |
        Remove o acesso na hora. Gastos e categorias personalizadas do usuário
        são apagados de forma assíncrona (evento `UserDeleted`).
      responses:
        "204": { description: Usuário excluído }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Operação recusada pelas regras da conta. `code`:
            `excluir_a_si_mesmo`, `ultimo_admin` ou `transicao_invalida`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /contas:
    get:
      tags: [colaboracao]
      operationId: obterContas
      summary: Contas do usuário e convites recebidos
      description: |
        A própria conta (papel `DONO`) primeiro, depois as contas em que o
        usuário colabora, e os convites pendentes para o e-mail verificado do
        token. Base do seletor de conta e do aviso de convites.
      responses:
        "200":
          description: Contas e convites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelaContas" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /contas/convites/{donoId}/aceitar:
    parameters:
      - $ref: "#/components/parameters/DonoIdPath"
    post:
      tags: [colaboracao]
      operationId: aceitarConvite
      summary: Aceitar convite
      description: Vale só para o e-mail verificado do token; convite de outro e-mail responde 404.
      responses:
        "200":
          description: Conta em que o usuário passou a colaborar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /contas/convites/{donoId}/recusar:
    parameters:
      - $ref: "#/components/parameters/DonoIdPath"
    post:
      tags: [colaboracao]
      operationId: recusarConvite
      summary: Recusar convite
      description: Apaga o convite e libera a vaga.
      responses:
        "204": { description: Convite recusado }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /contas/{donoId}/participacao:
    parameters:
      - $ref: "#/components/parameters/DonoIdPath"
    delete:
      tags: [colaboracao]
      operationId: sairDaConta
      summary: Sair de uma conta
      description: O colaborador deixa a conta; os gastos que lançou continuam nela.
      responses:
        "204": { description: Saiu da conta }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /colaboradores:
    get:
      tags: [colaboracao]
      operationId: listarColaboradores
      summary: Colaboradores da própria conta (dono)
      description: Membros e convites pendentes, que juntos somam até `limite`.
      responses:
        "200":
          description: Colaboradores
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelaColaboradores" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [colaboracao]
      operationId: convidar
      summary: Convidar colaborador (dono)
      description: |
        O e-mail é comparado em minúsculas e sem espaços nas pontas. Não se
        convida o próprio e-mail. Nenhum e-mail de notificação é enviado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConviteIn" }
      responses:
        "201":
          description: Convite pendente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConviteEnviado" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`code`: `ja_colaborador`, `convite_existente` ou `limite_colaboradores`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }

  /colaboradores/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserIdPath"
    patch:
      tags: [colaboracao]
      operationId: mudarPapel
      summary: Mudar o papel de um colaborador (dono)
      description: Vale na próxima requisição do colaborador, em até 10 segundos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PapelIn" }
      responses:
        "200":
          description: Colaborador atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Colaborador" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [colaboracao]
      operationId: removerColaborador
      summary: Remover colaborador (dono)
      description: O acesso termina em até 10 segundos; os gastos que ele lançou continuam na conta.
      responses:
        "204": { description: Colaborador removido }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /colaboradores/convites/{email}:
    parameters:
      - name: email
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 254 }
    delete:
      tags: [colaboracao]
      operationId: cancelarConvite
      summary: Cancelar convite (dono)
      responses:
        "204": { description: Convite cancelado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Cognito (cognito-local no ambiente local).

  parameters:
    Mes:
      name: mes
      in: query
      required: true
      description: Mês no formato AAAA-MM. O app envia o mês corrente no fuso do dispositivo.
      schema: { $ref: "#/components/schemas/Mes" }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Valor de `nextCursor` da página anterior.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      required: false
      description: Itens por página.
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
    Escopo:
      name: escopo
      in: query
      required: false
      description: |
        Alcance num parcelamento ou recorrência: `ESTA` (só este gasto, que
        fica ajustado), `PROXIMAS` (este e os seguintes) ou `TODAS`.
        Obrigatório num gasto de série; ignorado no gasto avulso.
      schema: { type: string, enum: [ESTA, PROXIMAS, TODAS] }
    XConta:
      name: X-Conta
      in: header
      required: false
      description: "`donoId` da conta ativa; ausente = a própria conta."
      schema: { type: string, minLength: 1, maxLength: 64 }
    DonoIdPath:
      name: donoId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }

  responses:
    BadRequest:
      description: Requisição inválida (por exemplo, `cursor_invalido` ou parâmetro malformado)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        Sem permissão: rota `/admin/*` sem o papel `admin`, escrita de um
        colaborador `LEITOR` (`somente_leitura`) ou gestão de colaboradores
        fora da própria conta (`somente_dono`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Recurso inexistente, de outro usuário, ou conta ativa sem acesso (`conta_nao_encontrada`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Dados inválidos; `errors[]` aponta cada campo
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: Erro interno; a causa fica só no log
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: Erro no formato RFC 9457 com as extensões `code` e `errors`.
      required: [type, title, status, code]
      properties:
        type: { type: string, example: "urn:gestor-gastos:problem:validacao" }
        title: { type: string, example: Dados inválidos }
        status: { type: integer, format: int32, example: 422 }
        detail: { type: string, description: Mensagem em pt-BR que pode ser exibida ao usuário }
        instance: { type: string, description: Path da requisição }
        code: { type: string, description: Código estável em snake_case, example: validacao }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: valorCentavos }
        message: { type: string, example: deve ser maior que zero }

    Mes:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: "2026-11"

    Data:
      type: string
      format: date
      example: "2026-11-03"

    Grupo:
      type: string
      enum: [CARTAO, FIXO]

    Papel:
      type: string
      enum: [cliente, admin]

    Status:
      type: string
      enum: [PENDENTE_CONFIRMACAO, ATIVO, BLOQUEADO, EXCLUIDO]

    Cor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      example: "#E4572E"

    Centavos:
      type: integer
      format: int64
      minimum: 0
      description: Valor em centavos de real.
      example: 4590

    Perfil:
      type: object
      required: [id, email, nome, papel, status, criadoEm]
      properties:
        id: { type: string, description: sub do Cognito }
        email: { type: string, format: email }
        nome: { type: string }
        papel: { $ref: "#/components/schemas/Papel" }
        status: { $ref: "#/components/schemas/Status" }
        criadoEm: { type: string, format: date-time }

    Usuario:
      allOf:
        - $ref: "#/components/schemas/Perfil"

    UsuarioPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Informe `status`, `papel` ou os dois.
      properties:
        status:
          type: string
          enum: [ATIVO, BLOQUEADO]
          description: BLOQUEADO bloqueia; ATIVO reativa.
        papel: { $ref: "#/components/schemas/Papel" }

    TelaAdminUsuarios:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: "#/components/schemas/Usuario" }
        nextCursor: { type: string }

    Categoria:
      type: object
      required: [id, nome, grupo, cor, padrao]
      properties:
        id: { type: string, example: alimentacao }
        nome: { type: string, example: Alimentação }
        grupo: { $ref: "#/components/schemas/Grupo" }
        cor: { $ref: "#/components/schemas/Cor" }
        padrao: { type: boolean, description: "true para as categorias do sistema, que não podem ser excluídas" }

    CategoriaIn:
      type: object
      required: [nome, grupo, cor]
      additionalProperties: false
      properties:
        nome: { type: string, minLength: 1, maxLength: 40, example: Pet }
        grupo: { $ref: "#/components/schemas/Grupo" }
        cor: { $ref: "#/components/schemas/Cor" }

    CategoriasPorGrupo:
      type: object
      required: [CARTAO, FIXO]
      description: Categorias visíveis, em ordem alfabética dentro de cada grupo.
      properties:
        CARTAO:
          type: array
          items: { $ref: "#/components/schemas/Categoria" }
        FIXO:
          type: array
          items: { $ref: "#/components/schemas/Categoria" }

    CategoriaResumo:
      type: object
      required: [id, nome, cor]
      properties:
        id: { type: string }
        nome: { type: string }
        cor: { $ref: "#/components/schemas/Cor" }

    GastoIn:
      type: object
      required: [valorCentavos, data, categoriaId]
      additionalProperties: false
      properties:
        valorCentavos:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000
          description: De R$ 0,01 a R$ 1.000.000,00.
          example: 4590
        data: { $ref: "#/components/schemas/Data" }
        categoriaId: { type: string, minLength: 1, maxLength: 64, example: alimentacao }
        descricao: { type: string, maxLength: 140, example: Almoço }
        recorrente:
          type: boolean
          default: false
          description: Informativo, dos gastos anteriores às séries. Para repetir o gasto, use `recorrencia`.
        cartaoId:
          type: string
          minLength: 1
          maxLength: 64
          description: Cartão ativo do usuário. Obrigatório para categoria do grupo `CARTAO`; opcional para `FIXO`.
        parcelamento: { $ref: "#/components/schemas/ParcelamentoIn" }
        recorrencia: { $ref: "#/components/schemas/RecorrenciaIn" }
        chaveIdempotencia:
          type: string
          minLength: 1
          maxLength: 128
          description: Gerada pelo app a cada envio do formulário; repetir o envio não duplica o lançamento. Só no POST.

    ParcelamentoIn:
      type: object
      description: |
        Só no POST, sem `recorrencia`. No modo `TOTAL`, `valorCentavos` é o
        total, dividido em `parcelas` com o resto na 1ª. No modo `PARCELA`,
        `valorCentavos` é o valor de cada parcela, da `parcelaAtual` até
        `parcelas` ou até o `mesFinal` (mês da fatura da última parcela).
      required: [modo]
      additionalProperties: false
      properties:
        modo: { type: string, enum: [TOTAL, PARCELA] }
        parcelas: { type: integer, format: int32, minimum: 2, maximum: 72 }
        parcelaAtual: { type: integer, format: int32, minimum: 1, maximum: 72, default: 1 }
        mesFinal: { $ref: "#/components/schemas/Mes" }

    RecorrenciaIn:
      type: object
      description: Só no POST, sem `parcelamento`. O gasto se repete todo mês, no mesmo dia, até o `mesFinal` (mês da data da última ocorrência) ou até ser encerrado.
      additionalProperties: false
      properties:
        mesFinal: { $ref: "#/components/schemas/Mes" }

    SerieGasto:
      type: object
      description: Posição do gasto num parcelamento ("3/10") ou numa recorrência.
      required: [id, tipo, numero]
      properties:
        id: { type: string }
        tipo: { type: string, enum: [PARCELAMENTO, RECORRENCIA] }
        numero: { type: integer, format: int32, minimum: 1 }
        total: { type: integer, format: int32, description: Total de parcelas; ausente na recorrência. }
        ajustado: { type: boolean, description: Editado com o alcance "só esta". }

    Gasto:
      type: object
      description: Gasto com a categoria e o cartão já resolvidos (nome e cor).
      required: [id, valorCentavos, data, mesReferencia, grupo, categoria, recorrente]
      properties:
        id: { type: string }
        valorCentavos: { type: integer, format: int64, example: 4590 }
        data: { $ref: "#/components/schemas/Data" }
        mesReferencia: { $ref: "#/components/schemas/Mes" }
        grupo: { $ref: "#/components/schemas/Grupo" }
        categoria: { $ref: "#/components/schemas/CategoriaResumo" }
        cartao: { $ref: "#/components/schemas/CartaoResumo" }
        descricao: { type: string }
        recorrente: { type: boolean }
        serie: { $ref: "#/components/schemas/SerieGasto" }
        lancadoPor:
          allOf: [{ $ref: "#/components/schemas/Pessoa" }]
          description: Quem lançou; os gastos anteriores aos colaboradores são do dono. Só na lista de gastos e na resposta do POST e do PUT.
        editadoPor:
          allOf: [{ $ref: "#/components/schemas/Pessoa" }]
          description: Quem editou por último; ausente se nunca foi editado depois dos colaboradores.

    Pessoa:
      type: object
      description: Autor de gasto ou membro da conta. Autor sem perfil aparece como "Ex-colaborador".
      required: [id, nome]
      properties:
        id: { type: string }
        nome: { type: string }

    TelaGastos:
      type: object
      required: [mes, itens, categorias]
      properties:
        mes: { $ref: "#/components/schemas/Mes" }
        itens:
          type: array
          items: { $ref: "#/components/schemas/Gasto" }
        nextCursor: { type: string }
        categorias: { $ref: "#/components/schemas/CategoriasPorGrupo" }
        cartoes:
          type: array
          description: Todos os cartões, ativos e arquivados, para o filtro.
          items: { $ref: "#/components/schemas/Cartao" }
        pessoas:
          type: array
          description: O dono e os membros da conta, para o filtro por pessoa.
          items: { $ref: "#/components/schemas/Pessoa" }

    TelaGastoForm:
      type: object
      required: [categorias, cartoes]
      properties:
        categorias: { $ref: "#/components/schemas/CategoriasPorGrupo" }
        cartoes:
          type: array
          description: Cartões ativos, mais o cartão arquivado do gasto em edição.
          items: { $ref: "#/components/schemas/Cartao" }
        gasto: { $ref: "#/components/schemas/Gasto" }

    Fatia:
      type: object
      description: |
        Fatia da pizza. Categorias trazem `categoriaId`, `grupo` e `cor`;
        grupos trazem `grupo`; cartões trazem `cartaoId` (ausente na fatia
        "Sem cartão") e `cor`. `detalhe` divide o valor da fatia: por cartão
        nas visões de categoria e de grupo, por grupo na visão de cartões.
      required: [nome, totalCentavos, percentualDecimos, detalhe]
      properties:
        categoriaId: { type: string }
        cartaoId: { type: string }
        grupo: { $ref: "#/components/schemas/Grupo" }
        nome: { type: string }
        cor: { $ref: "#/components/schemas/Cor" }
        totalCentavos: { $ref: "#/components/schemas/Centavos" }
        percentualDecimos:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: Décimos de ponto percentual (750 = 75,0%). Somam 1000 em cada visão não vazia.
        detalhe:
          type: array
          description: Partes da fatia, do maior valor para o menor; a soma é o total da fatia.
          items: { $ref: "#/components/schemas/ParteFatia" }

    ParteFatia:
      type: object
      required: [rotulo, totalCentavos]
      properties:
        rotulo: { type: string, example: Nubank }
        cor: { $ref: "#/components/schemas/Cor" }
        totalCentavos: { $ref: "#/components/schemas/Centavos" }

    TotalCartao:
      type: object
      description: Total de um cartão no mês. Sem `cartaoId` = "Sem cartão".
      required: [nome, totalCentavos]
      properties:
        cartaoId: { type: string }
        nome: { type: string, example: Nubank }
        cor: { $ref: "#/components/schemas/Cor" }
        totalCentavos: { $ref: "#/components/schemas/Centavos" }

    TotalGrupo:
      type: object
      required: [grupo, totalCentavos]
      properties:
        grupo: { $ref: "#/components/schemas/Grupo" }
        totalCentavos: { $ref: "#/components/schemas/Centavos" }

    TelaDashboard:
      type: object
      required: [mes, totalCentavos, totaisPorGrupo, totaisPorCartao, pizza, ultimos]
      properties:
        mes: { $ref: "#/components/schemas/Mes" }
        totalCentavos: { $ref: "#/components/schemas/Centavos" }
        totaisPorGrupo:
          type: array
          description: Sempre CARTAO e FIXO, nessa ordem; a soma é igual a totalCentavos.
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/TotalGrupo" }
        totaisPorCartao:
          type: array
          description: Cartões com gasto no mês e "Sem cartão", do maior para o menor; a soma é igual a totalCentavos.
          items: { $ref: "#/components/schemas/TotalCartao" }
        pizza:
          type: object
          description: Fatias em ordem decrescente de valor. Listas vazias no mês sem gastos.
          required: [todas, CARTAO, FIXO, grupos, cartoes]
          properties:
            todas:
              type: array
              items: { $ref: "#/components/schemas/Fatia" }
            CARTAO:
              type: array
              items: { $ref: "#/components/schemas/Fatia" }
            FIXO:
              type: array
              items: { $ref: "#/components/schemas/Fatia" }
            grupos:
              type: array
              items: { $ref: "#/components/schemas/Fatia" }
            cartoes:
              type: array
              items: { $ref: "#/components/schemas/Fatia" }
        ultimos:
          type: array
          maxItems: 5
          description: Até 5 gastos mais recentes do mês.
          items: { $ref: "#/components/schemas/Gasto" }

    Cartao:
      type: object
      required: [id, apelido, cor, diaFechamento, diaVencimento, limiteCentavos, arquivado]
      properties:
        id: { type: string }
        apelido: { type: string, example: Nubank }
        cor: { $ref: "#/components/schemas/Cor" }
        diaFechamento: { $ref: "#/components/schemas/DiaDoMes" }
        diaVencimento: { $ref: "#/components/schemas/DiaDoMes" }
        limiteCentavos: { $ref: "#/components/schemas/Centavos" }
        arquivado: { type: boolean }

    CartaoIn:
      type: object
      required: [apelido, cor, diaFechamento, diaVencimento, limiteCentavos]
      additionalProperties: false
      properties:
        apelido: { type: string, minLength: 1, maxLength: 40, example: Nubank }
        cor: { $ref: "#/components/schemas/Cor" }
        diaFechamento: { $ref: "#/components/schemas/DiaDoMes" }
        diaVencimento: { $ref: "#/components/schemas/DiaDoMes" }
        limiteCentavos:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000
          example: 500000

    CartaoPatch:
      type: object
      required: [arquivado]
      additionalProperties: false
      properties:
        arquivado: { type: boolean, description: true arquiva; false reativa }

    CartaoResumo:
      type: object
      required: [id, apelido, cor]
      properties:
        id: { type: string }
        apelido: { type: string }
        cor: { $ref: "#/components/schemas/Cor" }

    DiaDoMes:
      type: integer
      format: int32
      minimum: 1
      maximum: 31
      description: Dia do mês; um dia que não existe no mês vale como o último dia.

    ListaCartoes:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: "#/components/schemas/Cartao" }

    ResumoCartao:
      type: object
      required: [cartao, faturaCentavos, vencimento, limiteUsadoCentavos, limiteDisponivelCentavos]
      properties:
        cartao: { $ref: "#/components/schemas/Cartao" }
        faturaCentavos: { $ref: "#/components/schemas/Centavos" }
        vencimento: { $ref: "#/components/schemas/Data" }
        limiteUsadoCentavos: { $ref: "#/components/schemas/Centavos" }
        limiteDisponivelCentavos:
          type: integer
          format: int64
          description: Limite menos o usado; pode ser negativo.

    TelaCartoes:
      type: object
      required: [mes, hoje, cartoes]
      properties:
        mes: { $ref: "#/components/schemas/Mes" }
        hoje: { $ref: "#/components/schemas/Data" }
        cartoes:
          type: array
          description: Na ordem de apelido; ativos e arquivados.
          items: { $ref: "#/components/schemas/ResumoCartao" }

    PapelConta:
      type: string
      enum: [DONO, EDITOR, LEITOR]
      description: "`EDITOR` faz tudo o que o dono faz com gastos, cartões e categorias; `LEITOR` só consulta."

    PapelColaborador:
      type: string
      enum: [EDITOR, LEITOR]

    Conta:
      type: object
      required: [donoId, nomeDono, papel]
      properties:
        donoId: { type: string, description: Valor para o cabeçalho `X-Conta`. }
        nomeDono: { type: string, example: Ana }
        papel: { $ref: "#/components/schemas/PapelConta" }

    ConviteRecebido:
      type: object
      required: [donoId, nomeDono, papel, criadoEm]
      properties:
        donoId: { type: string }
        nomeDono: { type: string }
        papel: { $ref: "#/components/schemas/PapelColaborador" }
        criadoEm: { type: string, format: date-time }

    TelaContas:
      type: object
      required: [contas, convites]
      properties:
        contas:
          type: array
          description: A própria conta primeiro, depois as contas em que o usuário colabora.
          minItems: 1
          items: { $ref: "#/components/schemas/Conta" }
        convites:
          type: array
          items: { $ref: "#/components/schemas/ConviteRecebido" }

    Colaborador:
      type: object
      required: [userId, nome, email, papel, desde]
      properties:
        userId: { type: string }
        nome: { type: string }
        email: { type: string }
        papel: { $ref: "#/components/schemas/PapelColaborador" }
        desde: { type: string, format: date-time }

    ConviteEnviado:
      type: object
      required: [email, papel, criadoEm]
      properties:
        email: { type: string }
        papel: { $ref: "#/components/schemas/PapelColaborador" }
        criadoEm: { type: string, format: date-time }

    TelaColaboradores:
      type: object
      required: [membros, convites, limite]
      properties:
        membros:
          type: array
          items: { $ref: "#/components/schemas/Colaborador" }
        convites:
          type: array
          description: Convites pendentes, que também ocupam vaga.
          items: { $ref: "#/components/schemas/ConviteEnviado" }
        limite: { type: integer, format: int32, example: 5, description: Máximo de membros mais convites. }

    ConviteIn:
      type: object
      required: [email, papel]
      additionalProperties: false
      properties:
        email: { type: string, minLength: 1, maxLength: 254, example: bruno@x.com }
        papel: { $ref: "#/components/schemas/PapelColaborador" }

    PapelIn:
      type: object
      required: [papel]
      additionalProperties: false
      properties:
        papel: { $ref: "#/components/schemas/PapelColaborador" }
